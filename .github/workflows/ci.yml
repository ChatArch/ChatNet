name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - run: python -m pytest -q
      - name: Verify installed CLI contract
        run: |
          chatnet --version
          chatnet --tree
          chatnet --tree-brief
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify built wheel CLI contract
        run: |
          python -m venv "$RUNNER_TEMP/chatnet-wheel"
          "$RUNNER_TEMP/chatnet-wheel/bin/python" -m pip install dist/*.whl
          (
            cd "$RUNNER_TEMP"
            "$RUNNER_TEMP/chatnet-wheel/bin/chatnet" --version
            "$RUNNER_TEMP/chatnet-wheel/bin/chatnet" --tree
            "$RUNNER_TEMP/chatnet-wheel/bin/chatnet" --tree-brief
          )
      - name: Verify built wheel recovery assets
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/chatnet-wheel/bin/python" - <<'PY'
          from importlib.resources import files
          from pathlib import Path
          import chatnet

          assert 'site-packages' in str(Path(chatnet.__file__).resolve())
          root = files('chatnet').joinpath('data/systemd')
          for name in ('chatnet-recovery.service', 'chatnet-recovery.timer'):
              assert root.joinpath(name).is_file(), name
          print('Installed wheel recovery assets verified')
          PY
      - run: mkdocs build --strict
